[package]
name = "wave-win32"
description = "The real Windows implementation of wave-core's SystemProvider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wave-core = { path = "../wave-core" }
tracing = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Environment", "Management_Deployment", "Foundation_Collections", "ApplicationModel"] }
