name: Build & release binaries

# Builds the Windows desktop app and publishes it to a GitHub Release.
#
# Assets are named without a version so that
# github.com/<repo>/releases/latest/download/<asset> always resolves to the
# newest build — the download page links straight at those URLs and needs no
# change when a new version ships.
#
# The portable build ships as a .zip as well as a bare .exe, and the download
# page's main button points at the zip: browsers and Windows treat a directly
# downloaded, unsigned .exe far more harshly than the same file inside an
# archive, and Wave is unsigned until P5.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Defaults to v<version from tauri.conf.json>."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (Windows x64)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Builds the frontend and the Rust side, then wraps the result in an
      # NSIS installer.
      - name: Build the app
        run: npm run tauri build

      # Stable, version-free names so the download page's links keep working.
      # Tauri writes the installer with the version in its filename.
      - name: Collect the assets
        shell: bash
        run: |
          mkdir -p artifacts
          # Searched by shape rather than by a fixed path. src-tauri is a
          # workspace member, so Cargo writes to <repo>/target, not
          # <repo>/src-tauri/target — and Tauri puts the version in the
          # installer's filename and names the bare executable after either
          # the Cargo package or the product name depending on version.
          #
          # 2>/dev/null and || true are load-bearing: the step runs under
          # `set -e`, and find exits non-zero on a directory that does not
          # exist, which would kill the step before the diagnostics below
          # could report what actually got built.
          SETUP=$(find . -path '*/release/bundle/nsis/*-setup.exe' -print -quit 2>/dev/null || true)
          PORTABLE=$(find . -path '*/release/*.exe' \
                          -not -path '*/bundle/*' \
                          -not -path '*/build/*' \
                          -not -path '*/deps/*' \
                          -print -quit 2>/dev/null || true)

          echo "setup:    ${SETUP:-none}"
          echo "portable: ${PORTABLE:-none}"

          if [ -z "$SETUP" ] || [ -z "$PORTABLE" ]; then
            echo "the build did not produce both an installer and an executable" >&2
            echo "every .exe under a release directory:" >&2
            find . -path '*/release/*' -name '*.exe' >&2 2>/dev/null || true
            echo "everything under a bundle directory:" >&2
            find . -path '*/bundle/*' -type f >&2 2>/dev/null || true
            exit 1
          fi

          cp "$SETUP" "artifacts/Wave-Uninstaller-Setup-x64.exe"
          cp "$PORTABLE" "artifacts/Wave-Uninstaller-Portable-x64.exe"
          ls -la artifacts

      # The zip holds the executable and the licence, nothing else: the
      # portable build is one file, and a zip that unpacks into a folder of
      # mystery files is not more trustworthy for it.
      - name: Zip the portable build
        shell: pwsh
        run: |
          Copy-Item LICENSE artifacts/LICENSE.txt
          Compress-Archive -Path artifacts/Wave-Uninstaller-Portable-x64.exe, artifacts/LICENSE.txt `
            -DestinationPath artifacts/Wave-Uninstaller-Portable-x64.zip -Force
          Remove-Item artifacts/LICENSE.txt
          Get-ChildItem artifacts

      - name: Checksums
        shell: bash
        working-directory: artifacts
        run: |
          for FILE in *.exe *.zip; do
            certutil -hashfile "$FILE" SHA256 | sed -n '2p' | tr -d '\r' \
              | awk -v f="$FILE" '{print $0"  "f}' >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve the tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ needs.build.outputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wave Uninstaller ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            Windows build of Wave Uninstaller ${{ needs.build.outputs.version }}.

            **This build removes things.** It runs a program's own uninstaller,
            finds what was left behind, and moves it into a backup under
            `%ProgramData%\Wave\Backups`. Nothing is deleted, every step is
            journalled before it runs, and the Backups window puts an operation
            back. It asks for administrator rights on start, because removing a
            machine-wide program needs them.

            | File | What it is |
            | --- | --- |
            | `Wave-Uninstaller-Portable-x64.zip` | The app itself, zipped — the download page's main button |
            | `Wave-Uninstaller-Portable-x64.exe` | The same executable, unzipped |
            | `Wave-Uninstaller-Setup-x64.exe` | Installer |

            Neither is **code-signed**, so SmartScreen will warn on first
            launch: More info -> Run anyway.

            Verify a download against `SHA256SUMS.txt`.
