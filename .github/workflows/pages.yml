name: Website

# Publishes the contents of site/ on GitHub Pages.
#
# For this to take effect, Settings -> Pages in the repository must have the
# source set to "GitHub Actions". The alternative, "deploy from a branch", can
# only serve / or /docs and would never find site/.
#
# Pages is a mirror; Vercel is the canonical host (see site/README.md).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel a publish in flight: a half-uploaded site is worse than a
# minute of waiting.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # Static HTML, no build step: the folder is uploaded exactly as it sits
      # in the repository.
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
